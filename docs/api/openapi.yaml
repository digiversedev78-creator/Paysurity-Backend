  /subscriptions/{subscriptionId}/cancel:
    post:
      summary: Cancel an active subscription
      operationId: cancelSubscription
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: s1u2b3s4-c5r6-i7p8-9i0o-n1d2e3f4a5g6
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  example: No longer need the service
      responses:
        '200':
          description: Subscription cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId:
                    type: string
                    format: uuid
                    example: s1u2b3s4-c5r6-i7p8-9i0o-n1d2e3f4a5g6
                  status:
                    type: string
                    example: CANCELLED
                  cancellationDate:
                    type: string
                    format: date
                    example: '2024-04-15'
                  effectiveEndDate:
                    type: string
                    format: date
                    example: '2024-04-30'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        details:
          type: array
          items:
            type: string
          nullable: true
          example: ["Validation failed: email must be an email"]
  responses:
    BadRequest:
      description: Bad Request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              statusCode: 400
              message: "Invalid input"
              details: ["Field 'amount' is required."]
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              statusCode: 401
              message: "Unauthorized"
              details: ["Invalid or expired access token."]
    Forbidden:
      description: Forbidden - User does not have necessary permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              statusCode: 403
              message: "Forbidden"
              details: ["User does not have access to this resource."]
    NotFound:
      description: Not Found - The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              statusCode: 404
              message: "Resource not found"
              details: ["Wallet with ID '...' not found."]
    InternalServerError:
      description: Internal Server Error - Something went wrong on the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              statusCode: 500
              message: "Internal Server Error"
              details: ["An unexpected error occurred. Please try again later."]