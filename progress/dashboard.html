<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>EBT Progress</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:24px;max-width:980px}
    .meta{opacity:.8;margin-bottom:16px}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}
    .row{display:flex;justify-content:space-between;gap:16px;align-items:center}
    .bar{height:10px;border-radius:999px;background:#eee;overflow:hidden;margin-top:8px}
    .fill{height:100%;width:0;background:#2d6cdf}
    .pct{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
    .note{opacity:.85;margin-top:8px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>EBT Progress</h1>
  <div class="meta" id="meta">Loading…</div>
  <div id="buckets"></div>

<script>
async function main(){
  const res = await fetch('./progress.json', {cache:'no-store'});
  const data = await res.json();
  document.getElementById('meta').textContent =
    `Updated: ${data.updatedAt || 'TBD'}  |  Overall: ${Math.round((data.overall||0)*100)}%`;

  const root = document.getElementById('buckets');
  root.innerHTML = '';
  (data.buckets||[]).forEach(b=>{
    const pct = Math.max(0, Math.min(100, Math.round((b.pct||0)*100)));
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="row">
        <div><b>${b.label}</b></div>
        <div class="pct">${pct}%</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="note">${(b.notes||'').replaceAll('<','&lt;')}</div>
    `;
    root.appendChild(div);
  });
}
main();
</script>
</body>
</html>
