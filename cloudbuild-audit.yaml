steps:
- name: 'node:20'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    npm install typeorm pg csv-parse
    node $_SCRIPT
  secretEnv: ['DATABASE_URL']
substitutions:
  _SCRIPT: 'scripts/diagnostic-hob.js'
availableSecrets:
  secretManager:
  - versionName: projects/paysurity-platform-2026/secrets/paysurity-db-url/versions/latest
    env: 'DATABASE_URL'
options:
  logging: CLOUD_LOGGING_ONLY
