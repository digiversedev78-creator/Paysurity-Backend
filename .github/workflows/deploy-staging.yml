name: PaySurity Staging Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '8'

jobs:
  # ---------------------------------------------------------
  # CI STAGE: Continuous Integration & Security Validation
  # ---------------------------------------------------------
  validate:
    name: CI / Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get PNPM Store Directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Analysis (Lint & Typecheck)
        run: |
          pnpm lint
          pnpm tsc --noEmit

      - name: Cryptographic Unit Tests
        run: pnpm test:crypto

      - name: E2E Financial Flow Validation (Cypress)
        run: pnpm test:e2e

  # ---------------------------------------------------------
  # CD STAGE: Continuous Deployment to Staging
  # ---------------------------------------------------------
  deploy:
    name: CD / Deploy to Staging
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Cloud Provider
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Images
        run: |
          echo "Building PaySurity API Gateway..."
          docker build -t us-central1-docker.pkg.dev/paysurity-staging/repo/api-gateway:${{ github.sha }} -f apps/api/Dockerfile .
          docker push us-central1-docker.pkg.dev/paysurity-staging/repo/api-gateway:${{ github.sha }}

          echo "Building PaySurity Operations Dashboard..."
          docker build -t us-central1-docker.pkg.dev/paysurity-staging/repo/internal-ops:${{ github.sha }} -f apps/internal-ops-dashboard/Dockerfile .
          docker push us-central1-docker.pkg.dev/paysurity-staging/repo/internal-ops:${{ github.sha }}

      - name: Trigger Kubernetes Rolling Update
        run: |
          # Simulating Helm / Kubectl deploy to the Staging Cluster
          echo "Updating deployment images in Staging Kubernetes cluster..."
          kubectl set image deployment/api-gateway api-gateway=us-central1-docker.pkg.dev/paysurity-staging/repo/api-gateway:${{ github.sha }} -n paysurity-staging
          kubectl set image deployment/internal-ops internal-ops=us-central1-docker.pkg.dev/paysurity-staging/repo/internal-ops:${{ github.sha }} -n paysurity-staging

          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/api-gateway -n paysurity-staging
          kubectl rollout status deployment/internal-ops -n paysurity-staging
