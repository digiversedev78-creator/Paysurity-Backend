name: "02 - Continuous Deployment"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build NestJS application
        run: npm run build
      - name: Sweep banned imports
        run: npm run sweep:banned-imports

  deploy:
    name: Deploy to Staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      service_url: ${{ steps.get-service-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate Google Cloud CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Submit Cloud Build job
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions _GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},_DATABASE_URL=${{ secrets.DATABASE_URL }},_JWT_SECRET=${{ secrets.JWT_SECRET }}
      - name: Get deployed service URL
        id: get-service-url
        run: |
          SERVICE_NAME="paysurity-staging-app"
          REGION="us-central1"
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
                          --platform managed \
                          --region ${REGION} \
                          --format="value(status.url)")
          if [ -z "$SERVICE_URL" ]; then
            echo "Error: Could not retrieve service URL"
            exit 1
          fi
          echo "Discovered STAGING_SERVICE_URL: $SERVICE_URL"
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

  smoke-test:
    name: Run Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies for smoke test
        run: npm ci
      - name: Curl health endpoint
        run: curl -f -v "${{ needs.deploy.outputs.service_url }}/health" || exit 1
      - name: Run Node.js smoke test script
        run: node scripts/smoke-test.js
        env:
          STAGING_SERVICE_URL: ${{ needs.deploy.outputs.service_url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  notify-slack:
    name: Send Slack Notification
    if: always()
    needs: [verify, deploy, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: '#staging-deploys'
          slack-message: |
            *PaySurity Staging Deployment Result:* ${{ job.status }}
            *Repository:* `${{ github.repository }}`
            *Branch:* `${{ github.ref_name }}`
            *Commit:* `${{ github.sha }}`
            *Workflow Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            🚀 *Service URL:* ${{ needs.deploy.outputs.service_url }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
